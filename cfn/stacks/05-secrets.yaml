AWSTemplateFormatVersion: '2010-09-09'
Description: Daystrom Mini - Secrets Manager (DB credentials, Dynatrace credentials)

Parameters:
  ClusterName:
    Type: String
    Default: daystrom-mini
  DataStack:
    Type: String
    Default: daystrom-mini-data
  DBPassword:
    Type: String
    NoEcho: true
    Description: Must match the password used in stack 03-data
  DynatraceEndpoint:
    Type: String
    Default: ''
    Description: "e.g. https://<env-id>.live.dynatrace.com/api/v2/otlp"
  DynatraceApiToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: DT API token with openTelemetryTrace.ingest and metrics.ingest scopes

Resources:

  DBCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub /${ClusterName}/db-credentials
      Description: PostgreSQL credentials for Daystrom Mini
      SecretString: !Sub
        - >
          {"username":"daystrom",
           "password":"${DBPassword}",
           "host":"${DBHost}",
           "port":"5432",
           "database":"daystrom"}
        - DBHost:
            Fn::ImportValue: !Sub ${DataStack}-PostgresEndpoint

  DynatraceSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub /${ClusterName}/dt-credentials
      Description: Dynatrace OTel export credentials for Daystrom Mini
      SecretString: !Sub >
        {"DT_ENDPOINT":"${DynatraceEndpoint}",
         "DT_API_TOKEN":"${DynatraceApiToken}"}

Outputs:
  DBCredentialsSecretArn:
    Value: !Ref DBCredentialsSecret
    Export:
      Name: !Sub ${AWS::StackName}-DBCredentialsSecretArn

  DynatraceSecretArn:
    Value: !Ref DynatraceSecret
    Export:
      Name: !Sub ${AWS::StackName}-DynatraceSecretArn
