apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: daystrom-mini
spec:
  template:
    spec:
      initContainers:
        - name: download-model
          # Guard prevents re-download on pod restarts — model persists on EFS.
          command:
            - sh
            - -c
            - |
              if [ ! -f /models/model.gguf ]; then
                echo "Model not found on EFS, downloading (~400MB)..."
                curl -L -o /models/model.gguf \
                  "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
                echo "Download complete."
              else
                echo "Model found on EFS, skipping download."
              fi
      volumes:
        - $patch: replace
        - name: model-storage
          persistentVolumeClaim:
            claimName: llama-model-pvc
